name: Contracts, Tests & Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Lint:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        id: setup-ohos
        with:
          version: "7.0"

      - name: Verify SDK baseline and configure native compiler
        env:
          SDK_API: ${{ steps.setup-ohos.outputs.api-version }}
          SDK_NATIVE: ${{ steps.setup-ohos.outputs.ohos_sdk_native }}
          SDK_HOME: ${{ steps.setup-ohos.outputs.ohos-base-sdk-home }}
        run: |
          test "$SDK_API" = "26"
          echo "OHOS_SDK_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$SDK_NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_ohos=$SDK_NATIVE/llvm/bin/aarch64-unknown-linux-ohos-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_ohos=$SDK_NATIVE/llvm/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"
          components: "clippy"
          target: "aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos,x86_64-unknown-linux-ohos"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Native attachment lifecycle tests
        run: bash crates/ability/tests/run-attachment-host.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Host contract tooling tests and generated inventory diff
        run: pnpm run test:contracts

      - name: SDK-backed Node runtime tests
        run: pnpm test

      - name: Compile real plugin tests for OHOS (not host execution)
        run: pnpm run test:plugins

      - name: Link ARM64 native demos
        run: cargo build -p demo_native -p demo_sub_native --locked --target aarch64-unknown-linux-ohos

      - name: Format and lint
        run: npm run prek -- --all-files

      - name: Queued input behavior
        run: |
          rustc --edition=2021 --test crates/ability/src/input/queue.rs -o "$RUNNER_TEMP/ability-input-tests"
          "$RUNNER_TEMP/ability-input-tests"

      - name: Window status-bar regression tests
        run: node --experimental-vm-modules --test scripts/window-status-bar.test.mjs

      - name: Accessibility host routes and ArkTS contracts
        run: |
          bash crates/plugin-accessibility/tests/run-motion-host.sh
          node --test plugins/accessibility/tests/*.test.mjs

      - name: Rust clippy
        run: npm run lint:rs

      - name: Native input feature boundaries and ARM64 test linking
        run: |
          cargo clippy -p openharmony-ability --all-targets --target aarch64-unknown-linux-ohos --no-default-features --locked -- -D warnings
          for feature in keyboard keyboard-lock-state keyboard-text-input; do
            cargo clippy -p openharmony-ability --all-targets --target aarch64-unknown-linux-ohos --no-default-features --features "$feature" --locked -- -D warnings
          done
          cargo test -p openharmony-ability --lib --all-features --target aarch64-unknown-linux-ohos --no-run --locked
