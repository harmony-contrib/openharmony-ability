[package]
name = "demo_sub_native"
version = "1.0.0-beta.3"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { workspace = true, features = ["tokio_rt"] }
napi-derive-ohos = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
openharmony-ability-plugin-webview = { workspace = true }
openharmony-ability-plugin-window = { workspace = true }
# Required because the #[ability(...)] macro expands to code that calls log::info!
log = "0.4"

[build-dependencies]
napi-build-ohos = { workspace = true }
