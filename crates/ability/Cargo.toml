[package]
name = "openharmony-ability"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binding Rust application on Harmony with Ability"

[features]
default = ["log", "window"]
log = ["dep:log"]
window = ["dep:ohos-window-manager-binding"]
# ArkUI keyboard snapshots and consumption are opt-in; raw XComponent keys remain available.
keyboard = ["ohos-arkui-binding/api-15"]
# These features select linked NDK APIs and raise the application's minimum API.
api-19 = ["ohos-arkui-binding/api-19"]
api-26 = ["api-19", "ohos-ime-binding/api-26"]
# API-18 mouse cancellation is opt-in; basic XComponent mouse input remains available.
mouse = ["ohos-xcomponent-binding/api-18", "ohos-arkui-binding/api-15"]
stylus = ["ohos-arkui-binding/api-17"]
# Native file drag/drop is opt-in; ordinary keyboard/pointer input needs no UDMF or preview images.
drag = ["dep:ohos-udmf-binding", "ohos-arkui-binding/udmf", "ohos-arkui-binding/image"]

[dependencies]
# common dependencies
futures-channel = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
png = { workspace = true }

log = { version = "0.4", optional = true }

# for napi binding
napi-ohos = { workspace = true, features = ["napi8"] }
napi-derive-ohos = { workspace = true }

# for xcomponent native render
ohos-arkui-binding = { workspace = true, features = ["napi"] }
ohos-xcomponent-binding = { workspace = true }
# D5: remove this drag-only override when the bindings release unifies ArkUI/clipboard pins.
ohos-udmf-binding = { version = "0.0.7", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "43aec6c125503a47f7e875c793aaf2462e91ad19", features = ["api-13"], optional = true }
ohos-ime-binding = { workspace = true }
ohos-display-binding = { workspace = true }
ohos-resource-manager-binding = { workspace = true }

# cursor-grab NDK FFI (re-exported from the `window` module); api-22 feature
# gates OH_WindowManager_LockCursor/UnlockCursor
ohos-window-manager-binding = { workspace = true, optional = true, features = ["api-22"] }
