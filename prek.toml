#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  { id = "native-boundary", name = "native binding boundary", entry = "cargo run -p xtask --locked -- native-boundary", language = "system", pass_filenames = false, always_run = true },
  { id = "napi-contracts", name = "named N-API contract inventory", entry = "cargo run -p xtask --locked -- contracts --check", language = "system", pass_filenames = false, always_run = true },
  { id = "rustfmt", name = "rustfmt", entry = "cargo fmt --all -- --check", language = "system", files = "\\.rs$", pass_filenames = false },
  { id = "oxk-format", name = "oxk format", entry = "pnpm exec oxk format \"**/*.{ets,js,ts,json5}\" -t=10", language = "system", files = "\\.(ets|js|ts|json5)$", pass_filenames = false },
  { id = "oxk-lint", name = "oxk lint", entry = "pnpm run lint:oxk", language = "system", files = "\\.(ets|js|ts)$", pass_filenames = false },
]
