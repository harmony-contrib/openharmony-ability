[workspace]
members = ["crates/*", "rust_example/*", "xtask"]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.3"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
openharmony-ability-derive = { version = "1.0.0-beta.3", path = "crates/derive" }
openharmony-ability = { version = "1.0.0-beta.3", path = "crates/ability" }
openharmony-ability-plugin-app-control = { version = "1.0.0-beta.3", path = "crates/plugin-app-control" }
openharmony-ability-plugin-accessibility = { version = "1.0.0-beta.3", path = "crates/plugin-accessibility" }
openharmony-ability-plugin-clipboard = { version = "1.0.0-beta.3", path = "crates/plugin-clipboard" }
openharmony-ability-plugin-files = { version = "1.0.0-beta.3", path = "crates/plugin-files" }
openharmony-ability-plugin-permission = { version = "1.0.0-beta.3", path = "crates/plugin-permission" }
openharmony-ability-plugin-resource = { version = "1.0.0-beta.3", path = "crates/plugin-resource" }
openharmony-ability-plugin-screenshot = { version = "1.0.0-beta.3", path = "crates/plugin-screenshot" }
openharmony-ability-plugin-url = { version = "1.0.0-beta.3", path = "crates/plugin-url" }
openharmony-ability-plugin-webview = { version = "1.0.0-beta.3", path = "crates/plugin-webview" }
openharmony-ability-plugin-window = { version = "1.0.0-beta.3", path = "crates/plugin-window" }
openharmony-ability-plugin-statusbar = { version = "1.0.0-beta.3", path = "crates/plugin-statusbar" }
openharmony-ability-plugin-menu = { version = "1.0.0-beta.3", path = "crates/plugin-menu" }
openharmony-ability-plugin-notification = { version = "1.0.0-beta.3", path = "crates/plugin-notification" }
openharmony-ability-plugin-global-shortcut = { version = "1.0.0-beta.3", path = "crates/plugin-global-shortcut" }
openharmony-ability-plugin-deep-link = { version = "1.0.0-beta.3", path = "crates/plugin-deep-link" }
openharmony-ability-plugin-autostart = { version = "1.0.0-beta.3", path = "crates/plugin-autostart" }
openharmony-ability-plugin-continuation = { version = "1.0.0-beta.3", path = "crates/plugin-continuation" }
openharmony-ability-plugin-fault-injection = { version = "1.0.0-beta.3", path = "crates/plugin-fault-injection" }
openharmony-ability-plugin-account = { version = "1.0.0-beta.3", path = "crates/plugin-account" }
openharmony-ability-plugin-process = { version = "1.0.0-beta.3", path = "crates/plugin-process" }
openharmony-ability-plugin-system-state = { version = "1.0.0-beta.3", path = "crates/plugin-system-state" }
openharmony-ability-plugin-updater = { version = "1.0.0-beta.3", path = "crates/plugin-updater" }

napi-ohos = { version = "1.2" }
napi-derive-ohos = { version = "1.2" }
napi-build-ohos = { version = "1.2" }

syn = { version = "2", features = ["fold", "full", "extra-traits"] }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }

ohos-arkui-binding = { version = "0.4.2", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912" }
ohos-xcomponent-binding = { version = "0.5.2", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912", features = ["multi_mode", "accessibility", "api-15"] }
ohos-udmf-binding = { version = "0.0.7", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "a5542e29d45041175942ab4044531929842359b5", features = ["api-13"] }
# D3/D4 share PR #187's revision, which contains the D3 IME parent unchanged.
ohos-pasteboard-binding = { version = "0.0.7", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "a5542e29d45041175942ab4044531929842359b5", features = ["api-13"] }
ohos-ime-binding = { version = "0.3.1", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "a5542e29d45041175942ab4044531929842359b5" }
ohos-web-binding = { version = "0.3.0", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912" }
ohos-display-binding = { version = "0.1.4", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912" }
ohos-resource-manager-binding = { version = "0.3.4", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912" }
ohos-hilog-binding = { version = "0.2.4", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912" }
# Keep native wrappers on the same revision until the binding updates are released.
ohos-window-manager-binding = { version = "0.1.1", git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "842f4d4105b6c34a7c108d29c88d17cb496ed912" }

# Bridge runtime and examples use these without pinning versions in member manifests.
futures-channel = { version = "0.3" }
futures-executor = { version = "0.3" }
http = { version = "1" }

# Local dependencies used by legacy feature-gated modules
crossbeam-channel = { version = "0.5" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
png = "0.17"
