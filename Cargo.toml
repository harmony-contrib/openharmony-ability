[workspace]
members = ["crates/*", "rust_example/*"]
resolver = "2"

[workspace.dependencies]
openharmony-ability-derive = { version = "1.0.0-beta.0", path = "crates/derive" }
openharmony-ability = { version = "1.0.0-beta.0", path = "crates/ability" }
openharmony-ability-plugin-app-control = { version = "1.0.0-beta.0", path = "crates/plugin-app-control" }
openharmony-ability-plugin-autostart = { version = "1.0.0-beta.0", path = "crates/plugin-autostart" }
openharmony-ability-plugin-clipboard = { version = "1.0.0-beta.0", path = "crates/plugin-clipboard" }
openharmony-ability-plugin-files = { version = "1.0.0-beta.0", path = "crates/plugin-files" }
openharmony-ability-plugin-menu = { version = "1.0.0-beta.0", path = "crates/plugin-menu" }
openharmony-ability-plugin-permission = { version = "1.0.0-beta.0", path = "crates/plugin-permission" }
openharmony-ability-plugin-resource = { version = "1.0.0-beta.0", path = "crates/plugin-resource" }
openharmony-ability-plugin-statusbar = { version = "1.0.0-beta.0", path = "crates/plugin-statusbar" }
openharmony-ability-plugin-updater = { version = "1.0.0-beta.0", path = "crates/plugin-updater" }
openharmony-ability-plugin-url = { version = "1.0.0-beta.0", path = "crates/plugin-url" }
openharmony-ability-plugin-version = { version = "1.0.0-beta.0", path = "crates/plugin-version" }
openharmony-ability-plugin-webview = { version = "1.0.0-beta.0", path = "crates/plugin-webview" }
openharmony-ability-plugin-window = { version = "1.0.0-beta.0", path = "crates/plugin-window" }

napi-sys-ohos = { version = "1.2", features = ["napi8"] }
napi-ohos = { version = "1.2" }
napi-derive-ohos = { version = "1.2" }
napi-build-ohos = { version = "1.2" }

syn = { version = "2", features = ["fold", "full", "extra-traits"] }
quote = { version = "1.0" }
proc-macro2 = { version = "1.0" }

ohos-arkui-binding = { version = "0.2" }
ohos-xcomponent-binding = { version = "0.3" }
ohos-ime-binding = { version = "0.2" }
ohos-web-binding = { version = "0.2" }
ohos-display-binding = { version = "0.1" }
ohos-resource-manager-binding = { version = "0.3" }
ohos-resource-manager-sys = { version = "0.3" }
ohos-hilog-binding = { version = "0.2" }

# Bridge runtime and examples use these without pinning versions in member manifests.
crossbeam-channel = { version = "0.5" }
futures-channel = { version = "0.3" }
futures-executor = { version = "0.3" }
http = { version = "1" }
log = { version = "0.4" }
